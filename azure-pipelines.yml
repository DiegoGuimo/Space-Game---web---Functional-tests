trigger:
- '*'

variables:
  buildConfiguration: 'Release'
  wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  dotnetSdkVersion: '8.x'
  releaseBranchName: 'release'

stages:
- stage: Build
  displayName: Build the web application
  jobs: 
  - job: Build
    displayName: Build job
    pool:
      name: RetoAzure
      demands:
      - agent.name -equals MyAgent

    steps:
    - task: UseDotNet@2
      displayName: Use .NET SDK $(dotnetSdkVersion)
      inputs:
        version: $(dotnetSdkVersion)

    - task: UseNode@1
      displayName: Install Node.js 16.x
      inputs:
        version: 16.x

    - script: npm cache clean --force
      displayName: Clean NPM cache

    - task: Npm@1
      displayName: Run npm install
      inputs:
        verbose: false
        arguments: --no-optional

    - script: npx sass $(wwwrootDir) --no-source-map --style=compressed
      displayName: Compile Sass assets

    - script: npm install --global gulp-cli
      displayName: Install Gulp CLI globally

    - task: gulp@1
      displayName: Run gulp tasks

    - script: echo "$(Build.DefinitionName), $(Build.BuildId), $(Build.BuildNumber)" > buildinfo.txt
      displayName: Write build info
      workingDirectory: $(wwwrootDir)

    - task: DotNetCoreCLI@2
      displayName: Restore project dependencies
      inputs:
        command: restore
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: Build the project - $(buildConfiguration)
      inputs:
        command: build
        arguments: --no-restore --configuration $(buildConfiguration)
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: Publish the project - $(buildConfiguration)
      inputs:
        command: publish
        projects: '$(System.DefaultWorkingDirectory)/**/Tailspin.SpaceGame.Web.csproj'
        publishWebProjects: false
        arguments: --no-build --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/$(buildConfiguration)
        zipAfterPublish: true

    - publish: $(Build.ArtifactStagingDirectory)
      artifact: drop

- stage: 'Dev'
  displayName: 'Deploy to the dev environment'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Validate
    displayName: 'Validation Job'
    steps:
    - script: echo "Validation successful"

- stage: 'Deploy'
  displayName: 'Deploy the web application'
  dependsOn: Build
  jobs:
  - deployment: Deploy
    pool:
      name: 'RetoAzure'
      demands:
        - agent.name -equals MyAgent
    environment: dev
    variables:
    - group: Release
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop
          - task: AzureWebApp@1
            displayName: 'Azure App Service Deploy: website'
            inputs:
              azureSubscription: 'Resource Manager - Tailspin - Space Game'
              appName: '$(WebAppNameDev)'
              package: '$(Pipeline.Workspace)/drop/$(buildConfiguration)/*.zip'

- stage: 'Test'
  displayName: 'Deploy to the test environment'
  dependsOn: Dev
  jobs:
  - deployment: Deploy
    pool:
      name: 'RetoAzure'
      demands:
        - agent.name -equals MyAgent
    environment: test
    variables:
    - group: 'Release'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop
          - task: AzureWebApp@1
            displayName: 'Azure App Service Deploy: website'
            inputs:
              azureSubscription: 'Resource Manager - Tailspin - Space Game'
              appName: '$(WebAppNameTest)'
              package: '$(Pipeline.Workspace)/drop/$(buildConfiguration)/*.zip'
              
  - job: RunUITests
    dependsOn: Deploy
    displayName: 'Run UI tests'
    pool:
      name: 'RetoAzure'
      demands:
         - agent.name -equals MyAgent
    variables:
    - group: 'Release'
    steps:
    - script: |
        echo "Verificando instalación de Google Chrome..."
        if command -v chrome > /dev/null 2>&1; then
            echo "Google Chrome ya está instalado."
            chrome --version
        else
            echo "Google Chrome no está instalado. Procediendo con la instalación..."
            choco install googlechrome --force --no-progress
        fi
      displayName: "Verificar e instalar Google Chrome"

    - script: |
        echo "Verificando instalación de ChromeDriver..."
        CHROMEDRIVER_VERSION="133.0.6943.59"
        if command -v chromedriver > /dev/null 2>&1; then
            INSTALLED_VERSION=$(chromedriver --version | awk '{print $2}')
            echo "ChromeDriver instalado: $INSTALLED_VERSION"
            if [ "$INSTALLED_VERSION" != "$CHROMEDRIVER_VERSION" ]; then
                echo "Versión incorrecta de ChromeDriver. Instalando la versión correcta..."
                choco upgrade chromedriver --version=$CHROMEDRIVER_VERSION --force --no-progress
            fi
        else
            echo "ChromeDriver no está instalado. Instalando..."
            choco install chromedriver --version=$CHROMEDRIVER_VERSION --force --no-progress
        fi
      displayName: "Verificar e instalar ChromeDriver"

    - task: UseDotNet@2
      displayName: 'Use .NET SDK $(dotnetSdkVersion)'
      inputs:
        version: '$(dotnetSdkVersion)'

    - task: DotNetCoreCLI@2
      displayName: 'Build the project - $(buildConfiguration)'
      inputs:
        command: 'build'
        arguments: '--configuration $(buildConfiguration)'
        projects: '$(System.DefaultWorkingDirectory)/**/*UITests.csproj'

    - task: DotNetCoreCLI@2
      displayName: 'Run unit tests - $(buildConfiguration)'
      inputs:
        command: 'test'
        arguments: '--no-build --configuration $(buildConfiguration)'
        publishTestResults: true
        projects: '$(System.DefaultWorkingDirectory)/**/*UITests.csproj'  

- stage: 'Staging'
  displayName: 'Deploy to the staging environment'
  dependsOn: Test
  jobs:
  - deployment: Deploy
    pool:
      name: 'RetoAzure'
      demands:
        - agent.name -equals MyAgent
    environment: staging
    variables:
    - group: 'Release'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop
          - task: AzureWebApp@1
            displayName: 'Azure App Service Deploy: website'
            inputs:
              azureSubscription: 'Resource Manager - Tailspin - Space Game'
              appName: '$(WebAppNameStaging)'
              package: '$(Pipeline.Workspace)/drop/$(buildConfiguration)/*.zip'
