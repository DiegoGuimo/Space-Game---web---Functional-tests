trigger:
- '*'

variables:
  buildConfiguration: 'Release'
  wwwrootDir: 'Tailspin.SpaceGame.Web/wwwroot'
  dotnetSdkVersion: '8.x'
  releaseBranchName: 'release'

stages:
- stage: Build
  displayName: Build the web application
  jobs: 
  - job: Build
    displayName: Build job
    pool:
      name: RetoAzure
      demands:
      - agent.name -equals MyAgent

    steps:
    - task: UseDotNet@2
      displayName: Use .NET SDK $(dotnetSdkVersion)
      inputs:
        version: $(dotnetSdkVersion)

    - task: UseNode@1
      displayName: Install Node.js 16.x
      inputs:
        version: 16.x

    - script: npm cache clean --force
      displayName: Clean NPM cache

    - task: Npm@1
      displayName: Run npm install
      inputs:
        verbose: false
        arguments: --no-optional

    - script: npx sass $(wwwrootDir) --no-source-map --style=compressed
      displayName: Compile Sass assets

    - script: npm install --global gulp-cli
      displayName: Install Gulp CLI globally

    - task: gulp@1
      displayName: Run gulp tasks

    - script: echo "$(Build.DefinitionName), $(Build.BuildId), $(Build.BuildNumber)" > buildinfo.txt
      displayName: Write build info
      workingDirectory: $(wwwrootDir)

    - task: DotNetCoreCLI@2
      displayName: Restore project dependencies
      inputs:
        command: restore
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: Build the project - $(buildConfiguration)
      inputs:
        command: build
        arguments: --no-restore --configuration $(buildConfiguration)
        projects: '**/*.csproj'

    - task: DotNetCoreCLI@2
      displayName: Publish the project - $(buildConfiguration)
      inputs:
        command: publish
        projects: '$(System.DefaultWorkingDirectory)/**/Tailspin.SpaceGame.Web.csproj'
        publishWebProjects: false
        arguments: --no-build --configuration $(buildConfiguration) --output $(Build.ArtifactStagingDirectory)/$(buildConfiguration)
        zipAfterPublish: true

    - publish: $(Build.ArtifactStagingDirectory)
      artifact: drop

- stage: 'Dev'
  displayName: 'Deploy to the dev environment'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Validate
    displayName: 'Validation Job'
    steps:
    - script: echo "Validation successful"

- stage: 'Deploy'
  displayName: 'Deploy the web application'
  dependsOn: Build
  jobs:
  - deployment: Deploy
    pool:
      name: 'RetoAzure'
      demands:
        - agent.name -equals MyAgent
    environment: dev
    variables:
    - group: Release
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop
          - task: AzureWebApp@1
            displayName: 'Azure App Service Deploy: website'
            inputs:
              azureSubscription: 'Resource Manager - Tailspin - Space Game'
              appName: '$(WebAppNameDev)'
              package: '$(Pipeline.Workspace)/drop/$(buildConfiguration)/*.zip'

- stage: 'Test'
  displayName: 'Deploy to the test environment'
  dependsOn: Dev
  jobs:
  - deployment: Deploy
    pool:
      name: 'RetoAzure'
      demands:
        - agent.name -equals MyAgent
    environment: test
    variables:
    - group: 'Release'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop
          - task: AzureWebApp@1
            displayName: 'Azure App Service Deploy: website'
            inputs:
              azureSubscription: 'Resource Manager - Tailspin - Space Game'
              appName: '$(WebAppNameTest)'
              package: '$(Pipeline.Workspace)/drop/$(buildConfiguration)/*.zip'
  
  - job: RunUITests
    dependsOn: Deploy
    displayName: 'Run UI tests'
    pool:
      name: 'RetoAzure'
      demands:
         - agent.name -equals MyAgent
    variables:
    - group: 'Release'
    steps: 
    - script: |
        echo "Verificando instalación de Google Chrome..."
        if not exist "C:\Program Files\Google\Chrome\Application\chrome.exe" (
          echo "Instalando Google Chrome..."
          curl -o chrome_installer.exe https://dl.google.com/chrome/install/latest/chrome_installer.exe
          start /wait chrome_installer.exe /silent /install
          del chrome_installer.exe
        )
        echo "Google Chrome está instalado."
      displayName: 'Verificar e instalar Google Chrome'

    - script: |
        echo "Descargando e instalando ChromeDriver..."
        CHROME_VERSION=$(powershell "(Get-Item 'C:\Program Files\Google\Chrome\Application\chrome.exe').VersionInfo.FileVersion")
        CHROMEDRIVER_VERSION=$(curl -sS https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json | jq -r ".channels.Stable.version")
        curl -o chromedriver.zip https://storage.googleapis.com/chrome-for-testing-public/$CHROMEDRIVER_VERSION/win64/chromedriver-win64.zip
        powershell -Command "Expand-Archive -Path chromedriver.zip -DestinationPath C:\chromedriver"
        del chromedriver.zip
        echo "##vso[task.setvariable variable=PATH]C:\chromedriver;$(PATH)"
      displayName: 'Descargar e instalar ChromeDriver'
    
    - script: |
        echo "Descargando e instalando ChromeDriver..."
        for /f "tokens=2 delims==" %%A in ('wmic datafile where name^="C:\\Program Files\\Google\\Chrome\\Application\\chrome.exe" get Version /value ^| find "="') do set CHROME_VERSION=%%A
        echo Chrome Version: %CHROME_VERSION%
        
        powershell -Command "& {
          $chromeDriverVersion = (Invoke-WebRequest -Uri 'https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json' | ConvertFrom-Json).channels.Stable.version;
          echo 'ChromeDriver Version:' $chromeDriverVersion;
          $downloadUrl = 'https://storage.googleapis.com/chrome-for-testing-public/' + $chromeDriverVersion + '/win64/chromedriver-win64.zip';
          Invoke-WebRequest -Uri $downloadUrl -OutFile chromedriver.zip;
          Expand-Archive -Path chromedriver.zip -DestinationPath C:\chromedriver -Force;
          Remove-Item chromedriver.zip -Force;
        }"

        echo "##vso[task.setvariable variable=PATH]C:\chromedriver;%PATH%"
      displayName: 'Descargar e instalar ChromeDriver'



    - task: DotNetCoreCLI@2
      displayName: 'Build the project - $(buildConfiguration)'
      inputs:
        command: 'build'
        arguments: '--configuration $(buildConfiguration)'
        projects: '$(System.DefaultWorkingDirectory)/**/*UITests.csproj'
    
    - task: DotNetCoreCLI@2
      displayName: 'Run UI tests - $(buildConfiguration)'
      inputs:
        command: 'test'
        arguments: '--no-build --configuration $(buildConfiguration) --logger "trx;LogFileName=TestResults.trx"'
        publishTestResults: true
        projects: '$(System.DefaultWorkingDirectory)/**/*UITests.csproj'


- stage: 'Staging'
  displayName: 'Deploy to the staging environment'
  dependsOn: Test
  jobs:
  - deployment: Deploy
    pool:
      name: 'RetoAzure'
      demands:
        - agent.name -equals MyAgent
    environment: staging
    variables:
    - group: 'Release'
    strategy:
      runOnce:
        deploy:
          steps:
          - download: current
            artifact: drop
          - task: AzureWebApp@1
            displayName: 'Azure App Service Deploy: website'
            inputs:
              azureSubscription: 'Resource Manager - Tailspin - Space Game'
              appName: '$(WebAppNameStaging)'
              package: '$(Pipeline.Workspace)/drop/$(buildConfiguration)/*.zip'
