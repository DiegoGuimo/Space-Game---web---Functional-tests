trigger:
- main

pool:
  vmImage: 'windows-latest'  # Usa un agente Windows

steps:
# ======= Paso 1: Verificar e Instalar Google Chrome =======
- script: |
    echo "Verificando instalación de Google Chrome..."
    reg query "HKEY_LOCAL_MACHINE\SOFTWARE\Google\Chrome\BLBeacon" /v version
    if %ERRORLEVEL% neq 0 (
      echo "Instalando Google Chrome..."
      curl -o chrome_installer.exe https://dl.google.com/chrome/install/latest/chrome_installer.exe
      start /wait chrome_installer.exe /silent /install
      del chrome_installer.exe
    )
    echo "Google Chrome está instalado."
  displayName: 'Verificar e instalar Google Chrome'

# ======= Paso 2: Descargar e Instalar ChromeDriver =======
- powershell: |
    Write-Host "Descargando e instalando ChromeDriver..."
    $chromeVersion = (Get-ItemProperty "HKLM:\SOFTWARE\Google\Chrome\BLBeacon").version
    Write-Host "Versión de Chrome detectada: $chromeVersion"

    $majorVersion = $chromeVersion.Split(".")[0]
    $url = "https://chromedriver.storage.googleapis.com/LATEST_RELEASE_$majorVersion"
    $chromeDriverVersion = Invoke-WebRequest -Uri $url -UseBasicParsing | Select-Object -ExpandProperty Content
    Write-Host "ChromeDriver Version: $chromeDriverVersion"

    $downloadUrl = "https://chromedriver.storage.googleapis.com/$chromeDriverVersion/chromedriver_win32.zip"
    Invoke-WebRequest -Uri $downloadUrl -OutFile chromedriver.zip

    Expand-Archive -Path chromedriver.zip -DestinationPath C:\chromedriver -Force
    Remove-Item chromedriver.zip -Force

    [System.Environment]::SetEnvironmentVariable("PATH", "C:\chromedriver;" + [System.Environment]::GetEnvironmentVariable("PATH", [System.EnvironmentVariableTarget]::Machine), [System.EnvironmentVariableTarget]::Machine)
    Write-Host "ChromeDriver instalado correctamente y agregado al PATH."
  displayName: 'Descargar e instalar ChromeDriver'

# ======= Paso 3: Configurar Dependencias del Proyecto =======
- task: UseNode@1
  inputs:
    version: '21.x'  # Especifica la versión de Node.js

- script: |
    echo "Instalando dependencias del proyecto..."
    npm install
  displayName: 'Instalar dependencias'

# ======= Paso 4: Ejecutar Pruebas Automatizadas =======
- script: |
    echo "Ejecutando pruebas automatizadas..."
    npm test
  displayName: 'Ejecutar pruebas'

# ======= Paso 5: Publicar Resultados =======
- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/test-results.xml'
    mergeTestResults: true
  condition: succeededOrFailed()
  displayName: 'Publicar resultados de pruebas'

# ======= Paso 6: Publicar Artefactos (Opcional) =======
- task: PublishBuildArtifacts@1
  inputs:
    pathToPublish: '$(Build.ArtifactStagingDirectory)'
    artifactName: 'drop'
  displayName: 'Publicar artefactos'
